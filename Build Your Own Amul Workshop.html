<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Own Amul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a teal brand band, then a wide two-column workspace: dials and inputs on the left, live forecast and visuals on the right. Palette sampled from the YCP 5.0 banner. */
:root{
  --bg:#eef6f4; --ink:#0b2e2a; --muted:#3f6560; --card:#ffffff; --line:#cde1dd;
  --brand:#006d61; --board:#006d61; --chalk:#ffffff; --accent:#006d61; --on-accent:#ffffff; --hover:#004f46;
  --mint:#5eb4ae; --chalk-accent:#c4ece5;
  --good:#0a7a4f; --bad:#c43d3d;
  --c1:#006d61; --c2:#5eb4ae; --c3:#bfe3dd; --c4:#d54b4b; --c5:#0b2e2a;
  --display:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071f1c; --ink:#e8f4f1; --muted:#9cc2bc; --card:#0e2f2a; --line:#1f4a43;
    --accent:#7fd1c5; --on-accent:#05231f; --hover:#a8e4db;
    --good:#6fd6a2; --bad:#f08a80;
    --c1:#7fd1c5; --c2:#2f8c82; --c3:#1f5a52; --c4:#e0716b; --c5:#e8f4f1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071f1c; --ink:#e8f4f1; --muted:#9cc2bc; --card:#0e2f2a; --line:#1f4a43;
  --accent:#7fd1c5; --on-accent:#05231f; --hover:#a8e4db;
  --good:#6fd6a2; --bad:#f08a80;
  --c1:#7fd1c5; --c2:#2f8c82; --c3:#1f5a52; --c4:#e0716b; --c5:#e8f4f1;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1200px;margin:0 auto;padding:6px 24px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:800 clamp(32px,6vw,52px)/1.1 var(--display)}
h2{font:700 clamp(24px,4vw,34px)/1.2 var(--display)}
h3{font:700 20px/1.3 var(--body)}
h1:focus,h2:focus{outline:none}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.tag{font:700 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:15px}

/* brand band */
.brand{background-color:var(--brand);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;color:#fff}
.brand-in{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand .logo{display:block;height:48px;width:auto}
.brand .logo.ycp{height:50px}
.brand .rule{width:1px;align-self:stretch;min-height:48px;background:rgba(255,255,255,.55)}
.brand .pill{margin-left:auto;background:#fff;color:var(--brand);font:700 15px/1.2 var(--display);padding:9px 16px;border-radius:8px}
@media (max-width:560px){.brand .pill{margin-left:0;flex-basis:100%;text-align:center}.brand-in{padding:12px 16px}.wrap{padding:6px 16px 56px}}

/* board */
.board{position:sticky;top:8px;z-index:6;margin:16px 0 24px;background:var(--board);color:var(--chalk);border-radius:14px;padding:12px 18px 14px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--board)}
.board-head{display:flex;justify-content:space-between;gap:8px;font:700 13px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile .lab{font:700 12px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font:700 28px/1.15 var(--display);color:var(--chalk-accent);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tile .sub{font:400 12px/1.2 var(--body);opacity:.85}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--chalk-accent);border-radius:4px}
.delta{font:700 13px/1 var(--body);padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.18);color:var(--chalk)}
.delta.up{color:#a5f0c3}.delta.down{color:#ffbdb1}

/* layout */
.layout{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1.3fr) minmax(340px,.7fr)}.side{position:sticky;top:150px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
.scene{border-left:6px solid var(--mint)}
.learn{border-left:6px solid var(--good)}
.learn .tag{color:var(--good)}
.panel{display:flex;flex-direction:column;gap:22px}
.panel h3{padding-bottom:8px;border-bottom:2px solid var(--line)}

/* controls */
.btn{font:700 18px/1.2 var(--body);padding:15px 26px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;align-self:flex-start}
.btn:hover:not([disabled]){background:var(--hover);border-color:var(--hover)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--card)}
.btn.link{border:none;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;font-weight:400;font-size:15px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.flabel{font:700 18px/1.3 var(--body)}
.fval{font:700 22px/1 var(--display);color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.help{font-size:15px;color:var(--muted)}
input[type=text],input[type=number],textarea.in{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
input[type=number]{max-width:170px}
textarea.in{min-height:96px;resize:vertical}
input[type=text]:focus,input[type=number]:focus,textarea.in:focus{border-color:var(--accent);outline:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:7px;background:linear-gradient(90deg,var(--accent) var(--pct,50%),var(--line) var(--pct,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--card);border:5px solid var(--accent);margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:12px;border-radius:7px;background:var(--line)}
input[type=range]::-moz-range-progress{height:12px;border-radius:7px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:5px solid var(--accent)}
input:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}

/* budget split */
.alloc{display:flex;flex-direction:column;gap:14px}
.split{display:flex;height:26px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.split i{display:block;height:100%;transition:width .12s}
.arow{display:grid;grid-template-columns:22px 1fr;gap:4px 12px;align-items:center}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line)}
.arow .fhead{grid-column:2}
.arow input[type=range]{grid-column:2}
.arow .help{grid-column:2;margin-top:-4px}

/* forecast */
.fc{display:flex;flex-direction:column;gap:6px}
.fc-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:18px}
.fc-row:last-child{border-bottom:none}
.fc-row b{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
.fc-row.up b{color:var(--good)}.fc-row.down b{color:var(--bad)}.fc-row.zero b{color:var(--muted)}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 15px/1 var(--body);padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg)}
.chip.up{color:var(--good);border-color:var(--good)}
.chip.down{color:var(--bad);border-color:var(--bad)}
.gauge{height:16px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .12s}
.gauge.over i{background:var(--bad)}

/* seasons grid */
.gridwrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:300px;font-size:16px}
.grid th,.grid td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid td:first-child{text-align:left;font-weight:700}
.grid thead th{font:700 12px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.grid tr.you td:first-child{color:var(--accent)}
.pct{display:inline-block;min-width:48px;padding:4px 6px;border-radius:6px;font:700 15px/1.2 var(--body);font-variant-numeric:tabular-nums}
.pct.none{color:var(--muted);border:1px dashed var(--line);font-weight:400}

/* end */
.type{font:700 clamp(26px,5vw,38px)/1.15 var(--display);color:var(--accent)}
svg text{font-family:var(--body)}
textarea.sum{width:100%;min-height:300px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
ul.clean{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.result{scroll-margin-top:170px}
footer{margin-top:28px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion: no-preference){
  .stage > *{animation:rise .25s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){.split i,.gauge i{transition:none}}
</style>
</head>

  others.forEach(function(i){ out[i]= sumO>0 ? Math.floor(vals[i]*rest/sumO) : Math.floor(rest/others.length); used+=out[i]; });
  var order=others.slice().sort(function(x,y){ return vals[y]-vals[x]; }), rem=rest-used, k=0;

/* ---- round 2 ---- */
function deterrence(i){
  var p=S.inp[1], det=0.55*(p.fine/40);
  var clean = S.s2.you.slice(0,i).every(function(x){return x<0.15;});
  det += 0.45*(p.openness/10)*(clean?1:0.25);
  return cl(det,0,1);
}
function defectLast(i, except){
  if (i===0) return 0;
  var s=0, c=0, s2=S.s2;
  NAMES.forEach(function(nm){ if (nm!==except){ s+=s2.acts[nm][i-1]; c++; } });
  s+=s2.you[i-1]; c++; return s/c;
}
function nbAct(nm,i){
  var s2=S.s2, det=deterrence(i), g=defectLast(i,nm), E=S.flags.equalShare||0;
  var v=0;
  if (nm==='kanta') v=0;
  else if (nm==='ramesh') v = i===0 ? 0.6 : 0.6*(1-1.3*det);
  else if (nm==='bhanu') v = i===0 ? 0 : s2.you[i-1];
  else if (nm==='savitri') v = i===0 ? (S.m.trust<35?0.3:0) : mx(0, g*0.9-0.05);
  else if (nm==='dalpat') v = i===0 ? (E>=35?0.4:0) : g*1.4*(1-0.7*det);
  return Math.round(cl(v,0,1)*10)/10;
}
function playSeason(){
  var s2=S.s2, p=S.inp[1], i=s2.n, you=cl(Math.round(p.side)/100,0,1);
  s2.you.push(you);
  NAMES.forEach(function(nm){ s2.acts[nm].push(nbAct(nm,i)); });
  var sum=you; NAMES.forEach(function(nm){ sum+=s2.acts[nm][i]; });
  var f=1-sum/6, fineK=p.fine/40;
  var fx={
    income: 6*you*(1-p.fine/25) + 14*(f-0.8),
    trust:  14*(f-0.8) - 6*you - 2*fineK*(sum>you?1:0),
    voice:  -4*you,
    power:  12*(f-0.8),
    reserve:3*f + 2*fineK*sum
  };
  S.flash=null; var d=applyFx(fx);
  s2.n++; s2.last={f:f, deltas:d, you:you, ramesh:s2.acts.ramesh[i]};
  if (s2.n>=4){ s2.done=true; S.log.push({r:1, lines:['Fine on side-selling: '+p.fine+'% of value', 'Village meeting openness: '+p.openness+'/10', 'My prediction: '+p.predict+' of 5 neighbours sell on the side', 'Share of my milk sold to Polson per season: '+s2.you.map(function(x){return Math.round(x*100)+'%';}).join(', ')]}); S.hist_pending=true; }
  render();
  var el=document.getElementById('season-out'); if (el) scrollToEl(el);
}

/* ================= ending ================= */
function typeOf(m,f){
  if (f.outsideControl && m.voice<50) return ['Funded, but not yours','Money and machinery arrived, but the farmers no longer decide. This is mission drift, inside a cooperative\'s clothes.'];
  if (m.trust<35) return ['Brittle','On paper it is large, but members do not trust each other or the board, and one bad season could break it.'];
  if (m.power>=65 && m.voice<45) return ['Fast but top-heavy','Strong in the market, but ordinary farmers have little say in how it is run.'];
  if (m.voice>=60 && m.power<45) return ['Loved but small','Members feel it is theirs, but it has little weight with buyers.'];
  if (m.trust>=60 && m.voice>=50 && m.power>=55) return ['Rooted and strong','Members trust it, have a real say, and the market takes it seriously. That is hard to build and easy to lose.'];
  return ['Steady builder','It works and it is still the members\' own. It has not yet become either the biggest or the most democratic version of itself.'];
}
function strongWeak(){
  var ks=['trust','voice','power','reserve'], hi=ks[0], lo=ks[0];
  ks.forEach(function(k){ if (S.m[k]>S.m[hi]) hi=k; if (S.m[k]<S.m[lo]) lo=k; }); return {hi:hi,lo:lo};
}
function prompts(){
  var sw=strongWeak(), ys=S.s2.you.filter(function(x){return x>0;}).length;
  return [
    'My weakest meter at the end was '+LABELS[sw.lo].toLowerCase()+'. Which of my choices pulled it down, and what would I change?',
    ys===0 ? 'I delivered everything to the society in every season of Round 2. What made it easy or hard to resist Polson\'s higher price?' : 'I sold to Polson in '+ys+' of 4 seasons of Round 2 and watched Bhanu copy me. What does that show about how one member\'s choice spreads?',
    'The concept note says the first three principles do the most work: open membership, an equal vote, and surplus shared by use. Which of my three Round 1 settings held up best, and which would I change?'
  ];
}
function summaryText(){
  var m=S.m, t=typeOf(m,S.flags), nm=societyName();
  var L=['BUILD YOUR OWN AMUL: MY RUN', 'Society: '+(nm||'(not named)'), 'Type: '+t[0],
    'Final: pay '+m.income+' (Polson '+BASE[4]+'), trust '+m.trust+', member voice '+m.voice+', market power '+m.power+', reserve '+m.reserve+', villages '+m.villages, '', 'My settings:'];
  S.log.forEach(function(x){ L.push('Round '+(x.r+1)+':'); x.lines.forEach(function(l){ L.push('  - '+l); }); });
  L.push('','Reflection:');
  prompts().forEach(function(p,i){ L.push((i+1)+'. '+p, '   My answer: '+(S.answers[i]||''), ''); });
  return L.join('\n');
}
function chartSVG(){
  var mine=S.hist.slice(0,5), base=BASE, all=mine.concat(base);
  var lo=Math.floor((Math.min.apply(null,all)-5)/10)*10, hi=Math.ceil((Math.max.apply(null,all)+5)/10)*10;
  var W=420,H=230,pl=40,pr=96,pt=16,pb=30;
  function X(i){ return pl+(W-pl-pr)*i/4; } function Y(v){ return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo)); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Your pay after each round: '+mine.join(', ')+'. Polson pays: '+base.join(', ')+'.">';
  for (var g=0; g<=4; g++){ var v=lo+(hi-lo)*g/4;
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+Math.round(v)+'</text>'; }
  for (var i=0;i<5;i++) s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="var(--muted)">Round '+(i+1)+'</text>';
  function line(arr,color,dash){ return '<polyline fill="none" stroke="'+color+'" stroke-width="3.5" '+(dash?'stroke-dasharray="7 5" ':'')+'points="'+arr.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'"/>'; }
  s+=line(base,'var(--bad)',true)+line(mine,'var(--good)',false);
  var li=mine.length-1, up=mine[li]>=base[4];
  s+='<circle cx="'+X(li)+'" cy="'+Y(mine[li])+'" r="5.5" fill="var(--good)"/><text x="'+(X(li)+10)+'" y="'+(Y(mine[li])+(up?-2:14))+'" font-size="13" font-weight="700" fill="var(--good)">You '+mine[li]+'</text>';
  s+='<circle cx="'+X(4)+'" cy="'+Y(base[4])+'" r="5.5" fill="var(--bad)"/><text x="'+(X(4)+10)+'" y="'+(Y(base[4])+(up?14:-2))+'" font-size="13" font-weight="700" fill="var(--bad)">Polson '+base[4]+'</text>';
  return h('div',{html:s+'</svg>'});
}
function viewEnd(){
  var t=typeOf(S.m,S.flags), sw=strongWeak(), gain=S.m.income-BASE[4], nm=societyName();
  var ta=h('textarea',{class:'sum',id:'summary',readonly:true,'aria-label':'Summary of your run, ready to copy'}); ta.value=summaryText();
  var msg=h('span',{class:'muted small',id:'copymsg',role:'status'});
  var ps=prompts();
  var answers=ps.map(function(p,i){
    var area=h('textarea',{class:'in',id:'ans'+(i+1),'aria-label':'Your answer to question '+(i+1),placeholder:'Type your answer here'}); area.value=S.answers[i]||'';
    area.addEventListener('input',function(){ S.answers[i]=area.value; ta.value=summaryText(); });
    return h('div',{class:'field'}, h('label',{class:'flabel','for':'ans'+(i+1)},(i+1)+'. '+p), area);
  });
  var leftCol=h('div',{class:'stack'},
    h('div',{class:'stack-sm'}, h('div',{class:'tag'},'1973 · '+(nm||'Your cooperative')), h('h1',{tabindex:'-1'},'How it turned out'), h('div',{class:'type'},t[0]), h('p',null,t[1])),
    h('div',{class:'card stack-sm'}, h('div',{class:'tag'},'Your pay, compared with staying with Polson'), chartSVG(),
      h('p',null, gain>0 ? 'Farmers in your cooperative earn '+gain+' points more per litre than an unorganised farmer would by 1973.' : (gain===0 ? 'Your cooperative pays the same as Polson. The gain is in who owns it.' : 'Your cooperative pays '+Math.abs(gain)+' points less than Polson would. Ownership is yours, but the market is not yet.')),
      h('p',{class:'muted small'},'Stylised numbers, for learning.')),
    h('div',{class:'card stack-sm'}, h('div',{class:'tag'},'What your choices show'),
      h('ul',{class:'clean'},
        h('li',null,'Your strongest meter was '+LABELS[sw.hi].toLowerCase()+' ('+S.m[sw.hi]+'), and your weakest was '+LABELS[sw.lo].toLowerCase()+' ('+S.m[sw.lo]+').'),
        S.inp[0].promise && S.inp[0].promise.trim() ? h('li',null,'You promised: "'+S.inp[0].promise.trim()+'". Did your later choices keep that promise?') : null,
        h('li',null,'In the real story, Amul began with two village societies, hired a professional manager around 1950-51, and was joined by a state federation in 1973. Every step cost its members something, and every step was a choice.'),
        h('li',null,'The concept note\'s last line: a way to begin with what is at hand, support that keeps the aim going, and a structure where the people it serves have a say. Check each against your run.'))));
  var rightCol=h('div',{class:'stack'},
    h('div',{class:'card panel'}, h('h3',null,'Reflect in your own words'), answers),
    h('div',{class:'card stack-sm'}, h('h3',null,'Your summary'),
      h('p',{class:'muted small'},'It includes your settings and your answers. Copy it and paste it into your reflection form.'), ta,
      h('div',{style:'display:flex;gap:12px;align-items:center;flex-wrap:wrap'},
        h('button',{class:'btn',id:'copy',onclick:function(){
          ta.value=summaryText(); ta.focus(); ta.select();
          var done=function(ok){ msg.textContent = ok?'Copied.':'Select the text above and copy it.'; };
          try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function(){done(true);},function(){done(false);}); else done(false); } catch(e){ done(false); }
        }},'Copy summary'), msg)),
    h('button',{class:'btn ghost',id:'again',onclick:function(){ S=fresh(); render(); }},'Play again with different choices'));
  return [h('div',{class:'layout',style:'align-items:start'}, leftCol, rightCol)];
}

/* ================= render ================= */
var lastKey='';
function render(){
  renderBoard();
  var stage=document.getElementById('stage'); stage.innerHTML='';
  var view = S.screen==='intro'?viewIntro() : (S.screen==='end'?viewEnd() : viewRound());
  [].concat(view).forEach(function(n){ if (n) stage.append(n); });
  var foot=document.getElementById('foot'); foot.innerHTML='';
  if (S.screen==='round') foot.append(h('button',{class:'btn link',id:'restart',onclick:function(){ S=fresh(); render(); }},'Restart from 1945'));
  var key=S.screen+'|'+S.r;
  if (key!==lastKey){
    lastKey=key; try { window.scrollTo(0,0); } catch(e){}
    var hd=stage.querySelector('h1,h2'); if (hd){ try { hd.focus({preventScroll:true}); } catch(e){} }
  }
}

/* ================= boot ================= */
var hot=window.claude && window.claude.hot;
function start(data){ S=(data && data.S)?data.S:fresh(); render(); }
if (hot && hot.snapshot) hot.snapshot(function(){ return {S:S}; });
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
